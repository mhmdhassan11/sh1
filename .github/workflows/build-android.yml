name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ نسخ المشروع
      - uses: actions/checkout@v3

      # 2️⃣ تحميل Godot headless
      - name: Download Godot Headless
        run: |
          wget https://downloads.tuxfamily.org/godotengine/4.2/Godot_v4.2-stable_linux_headless.64.zip -O godot.zip || true
          unzip -o godot.zip -d godot
          chmod +x godot/Godot_v4.2-stable_linux_headless.64

      # 3️⃣ بناء APK
      - name: Build Android APK
        run: |
          godot/Godot_v4.2-stable_linux_headless.64 --headless --export "Android" build/android/ShadowMatch.apk

      # 4️⃣ رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMatch-APK
          path: build/android/ShadowMatch.apk