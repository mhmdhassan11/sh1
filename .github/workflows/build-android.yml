name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # نسخ الكود
      - uses: actions/checkout@v3

      # استخدام Godot Export v4 لبناء APK
      - uses: firebelley/godot-export@v4
        with:
          godot-version: 4.2
          export-name: ShadowMatch
          export-presets: Android

      # رفع APK جاهز للتحميل
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowMatch-APK
          path: build/android/*.apk